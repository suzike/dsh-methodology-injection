<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="方法论注入 · DSH 插件">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E16"/>
      <stop offset="0.55" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#4FD1C5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>

  <!-- 背景方法论星座：只做氛围，不做信息 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#FFFFFF" fill-opacity="0.09">
    <text x="1030" y="96">第一性原理</text>
    <text x="1240" y="150">苏格拉底反诘</text>
    <text x="1090" y="210">金字塔原理</text>
    <text x="1330" y="262">事前验尸</text>
    <text x="1010" y="322">贝叶斯更新</text>
    <text x="1250" y="380">六顶思考帽</text>
    <text x="1080" y="438">约束扫描</text>
    <text x="1330" y="492">汉隆剃刀</text>
  </g>
  <g stroke="#7C6CFF" stroke-opacity="0.18" stroke-width="1">
    <path d="M1075 90 L1245 145 L1125 205 L1315 258 L1060 318 L1235 376 L1105 434"/>
  </g>

  <!-- 左：标题块 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="96" y="150" font-size="15" letter-spacing="6" fill="#8B93A7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">DSH PLUGIN · v0.1.0 · MIT</text>

    <text x="92" y="268" font-size="92" font-weight="700" fill="#F5F7FA" letter-spacing="-1">方法论注入</text>
    <rect x="96" y="300" width="176" height="4" rx="2" fill="url(#accent)"/>

    <text x="96" y="366" font-size="27" fill="#B9C0D0" font-family="'Noto Serif SC','Songti SC','SimSun',serif">选一个方法论，这一轮就按它的方式回答。</text>
    <text x="96" y="412" font-size="19" fill="#6F7788">65 个方法论 · 6 类 · 43 组互斥裁决 · 单条注入 ≤150 token · 全程可回溯</text>
  </g>

  <!-- 左下：三个能力点 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">
    <g>
      <rect x="96" y="452" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="124" y="478" fill="#C7CEDC">⌘K 打开</text>
    </g>
    <g>
      <rect x="262" y="452" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="290" y="478" fill="#C7CEDC">只对下一轮生效</text>
    </g>
    <g>
      <rect x="474" y="452" width="182" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="502" y="478" fill="#C7CEDC">轮末留痕可回溯</text>
    </g>
  </g>

  <!-- 右下：输入框示意 -->
  <g transform="translate(880 372)">
    <rect x="0" y="0" width="624" height="120" rx="18" fill="#0F1522" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="28" y="46" font-size="16" fill="#5D6678" font-family="'Noto Sans SC','PingFang SC',sans-serif">把这段需求写成能过的周报……</text>
    <g font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="15">
      <rect x="24" y="66" width="132" height="36" rx="18" fill="#7C6CFF" fill-opacity="0.16" stroke="#7C6CFF" stroke-opacity="0.5"/>
      <text x="44" y="90" fill="#C9C2FF">✦ 金字塔原理</text>
      <text x="176" y="90" fill="#5D6678">＋ 加方法</text>
    </g>
    <rect x="536" y="66" width="64" height="36" rx="18" fill="url(#accent)" fill-opacity="0.9"/>
    <path d="M556 84 L580 84 M572 76 L580 84 L572 92" stroke="#0A0E16" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
